name: GDK-Proton 11.0-7 (bionic layer)
run-name: "GDK-Proton 11.0-7 — ${{ github.ref_name }} (${{ github.event_name }})"

# Collapsed SDK matrix: one dispatch builds every SDK (api_level) x arch leg.
# The old build-proton-sdk28.yml + build-proton-sdk35.yml were near-identical; their
# only real difference was the Android API/SDK level, which the build-step scripts
# select via --enable-16kb-pages (default TARGET=aarch64-linux-android28; the flag
# flips it to android35 + 16KB page linker flags). That difference is now a matrix
# axis. api_level 28 -> no flag (4KB pages); api_level 35 -> --enable-16kb-pages.
#
# GE-Proton 11.0-7 builds arm64ec (aarch64, sdk28 target, 16 KB page alignment) plus an
# x86_64 (box64) leg shaped exactly like the x86_64 layer Proton 11.0-2 shipped in v7:
# the api_level 28 leg, 4 KB page alignment (no --enable-16kb-pages).
#
# GDK-Proton 11.0-7 is that GE-Proton 11.0-7 layer plus the WineGDK modules and prefix
# DLLs GDK-Proton-Custom (LukasPAH, release-11-7) adds; it installs as its own slot.

# This file is named per layer on purpose: GitHub labels a run with the workflow name
# from the DEFAULT branch's copy of the same path, so a shared build-proton.yml made
# every layer's run read "11.0-1". A distinct path per branch shows the real name.
on:
  push:
    # gdk-proton-11.7 self-builds on push: this workflow only exists on the GDK
    # branch, and GitHub registers workflow_dispatch only for workflows on the
    # default branch — so a bare dispatch 404s here. Firing on push to the GDK
    # branch runs the CORRECT workflow at the CORRECT ref (no wrong-tag risk).
    branches: [ gdk-proton-11.7, 'staging/gdk-proton-11.7/**' ]
  pull_request:
    branches: [ main, master, proton_11.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64, x86_64]
        api_level: [28]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libwayland-bin \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Autogen
        run: |
          bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # ccache — caches compiled objects across runs (per-arch AND per-api_level, so the
      # 4KB-page and 16KB-page object sets never collide). Exact key (per-commit) = full
      # warm restore on a re-run of the same commit; restore-keys pull the newest prior
      # cache for the same arch+api so an unchanged-source rebuild is near-instant. ccache
      # self-validates staleness, so a rolling restore is safe.
      - name: Cache ccache (${{ matrix.arch }} / sdk${{ matrix.api_level }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-sysvshm
          else
            bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          fi

      - name: Configure build for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --configure
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --configure
          fi

      - name: Build Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --build
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --build
          fi

      - name: ccache stats (${{ matrix.arch }} / sdk${{ matrix.api_level }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --install
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --install
          fi

      # Binary verification of the installed tree BEFORE packaging: refuses a layer that
      # compiled fine but lost a feature (patch dropped, #ifdef'd out, wrong API level,
      # wrong page alignment, skeleton tree from a failed make). See verify-layer.py.
      - name: Verify layer binaries for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
          fi
          # Every leg compiles against the android28 NDK target (true sdk28); the api_level 35
          # leg only adds 16 KB linker alignment (mirrors PAGES_FLAG in the build-step scripts).
          PAGES=4k; API=28
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES=16k
          GE=""; [ -d android/ge-patches/game-fixes ] && GE="--ge"
          python3 build-scripts/verify-layer.py "$OUTPUT_DIR" --arch ${{ matrix.arch }} --api $API --pages $PAGES $GE --gdk

      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          # Pinned to GameNative/bionic-prefix-files @ 6286ac45 (2026-05-07, the files every
          # shipped layer was built with) and sha256-checked: a push to their `main` must never
          # change what our layer ships, and a truncated download must never be packaged.
          PIN=6286ac456e4a8376e053ce1ce4f565bd37cc4af4
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            NAME=prefixPack-x86_64-11.txz
            SHA=d8d1d8af905af40ae7f37114de1cf87575f88827fd8e2780cd2f92d7852a8ed0
          else
            NAME=prefixPack-arm64ec-11.txz
            SHA=ade99dc80b17086a269c038c9bc50167902103a9a61df763cba4d613543ff12a
          fi
          wget --tries=5 --retry-connrefused --waitretry=10 "https://raw.githubusercontent.com/GameNative/bionic-prefix-files/$PIN/$NAME" -O $GITHUB_WORKSPACE/prefixPack.txz
          echo "$SHA  $GITHUB_WORKSPACE/prefixPack.txz" | sha256sum -c -

      # GDK-Proton: the prefix-side half of GDK-Proton-Custom (its patch_proton.sh copies the
      # XCurl/libcurl DLL set into system32 of each new prefix; here they ride in prefixPack).
      - name: Add the GDK-Proton system32 DLLs to prefixPack.txz
        run: bash build-scripts/gdk-prefix-dlls.sh $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json files
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
            DESC="GDK-Proton 11.0-7 x86_64 (bionic, box64) — WineGDK xgameruntime + WinRT modules and XCurl from GDK-Proton-Custom release-11-7, on GE-Proton 11.0-7: Valve + fast-yield gate + xrandr/xrender + GE-Proton11-7 game-fixes (maplestory, dai_xinput, eac, pso2, assettocorsa, silence-starcitizen, vgsoh, WM_ACTIVATEAPP, black-desert fullscreen, max-payne cpu detection, ai-limit dx12 compute fallback) + realized-font-handle cap 32768 + DirectAudio v1.3.2 + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale). Bannerlator/WinNative/Winlator-bionic; needs a fresh x86_64 (box64) container."
          else
            ARCH_NAME="arm64ec"
            DESC="GDK-Proton 11.0-7 ${ARCH_NAME} (bionic) — WineGDK xgameruntime + WinRT modules and XCurl from GDK-Proton-Custom release-11-7, on GE-Proton 11.0-7: Valve + fast-yield gate + FEX-unixlib loader + xrandr/xrender + GE-Proton11-7 game-fixes (maplestory, dai_xinput, eac, pso2, assettocorsa, silence-starcitizen, vgsoh, WM_ACTIVATEAPP, black-desert fullscreen, max-payne cpu detection) + realized-font-handle cap 32768 + DirectAudio v1.3.2 + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale). Wayland + HDR10 added."
          fi

          # Identity: Winlator (Ludashi/CMOD WineInfo) only accepts <digits.>-<digits.>-<arch>
          # as versionName and strips a single-digit versionCode, so "GDK-Proton" cannot be in
          # it. 11.0-7.90 keeps this its own slot, clear of GE 11.0-7 and GE 11.0-7.1.
          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "11.0-7.90-${ARCH_NAME}",
            "versionCode": 1,
            "description": "${DESC}",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.0-7.90-${ARCH_NAME}",
            "versionCode": 1,
            "description": "${DESC}",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi

          cd $OUTPUT_DIR

          # The Wayland driver on its own, laid out like the installed Proton directory. The
          # x86_64 (box64) leg has no winewayland, so its copy loop is a no-op.
          for f in lib/wine/aarch64-unix/winewayland.so lib/wine/aarch64-windows/winewayland.drv \
                   lib/wine/i386-windows/winewayland.drv; do
            if [ -f "$f" ]; then mkdir -p "$GITHUB_WORKSPACE/winewayland-files/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/winewayland-files/$f"; fi
          done

          # Create Proton WCP - zstd (tar.zst) for fast in-app install. The app's ContentsManager
          # tries XZ then falls back to ZSTD, so a zstd .wcp installs with no app change and decompresses
          # far faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf GDK-Proton-11.0-7-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv GDK-Proton-11.0-7-$ARCH_NAME.wcp $GITHUB_WORKSPACE/

          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf GDK-proton-wine-11.0-7-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv GDK-proton-wine-11.0-7-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/

      # The packaged archive must carry exactly what the app's ContentsManager expects.
      - name: Verify wcp archives
        run: |
          cd $GITHUB_WORKSPACE
          UNIX="${{ matrix.arch }}-unix"
          for WCP in *.wcp; do
            echo "== $WCP ($(stat -c %s "$WCP") bytes)"
            echo "   sha256 $(sha256sum "$WCP" | cut -d' ' -f1)  size $(stat -c %s "$WCP")"
            tar -I zstd -tf "$WCP" > wcp.lst
            PE="${{ matrix.arch }}-windows"
            for e in profile.json prefixPack.txz bin/wine "lib/wine/$UNIX/ntdll.so" "lib/wine/$UNIX/win32u.so" share/wine/wine.inf \
                     "lib/wine/$PE/xgameruntime.dll" "lib/wine/$PE/Microsoft.WindowsAppRuntime.Bootstrap.dll"; do
              grep -qx -- "$e" wcp.lst || { echo "FATAL: $e missing from $WCP"; exit 1; }
            done
            tar -I zstd -xf "$WCP" -O prefixPack.txz > wcp-prefixPack.txz
            tar -tJf wcp-prefixPack.txz > wcp-prefix.lst
            grep -qx .wine/drive_c/windows/system32/XCurl.dll wcp-prefix.lst \
              || { echo "FATAL: prefixPack.txz inside $WCP has no system32/XCurl.dll"; exit 1; }
            tar -I zstd -xf "$WCP" -O profile.json > wcp-profile.json
            cmp wcp-profile.json profile.json || { echo "FATAL: profile.json inside $WCP differs from the generated one"; exit 1; }
            python3 -c 'import json,sys; p=json.load(open("wcp-profile.json")); print("   type=%s versionName=%s versionCode=%s" % (p["type"], p["versionName"], p["versionCode"])); print("   description=%s" % p["description"]); print("   wine=%s files=%s" % (json.dumps(p["wine"]), json.dumps(p["files"])))'
            echo "   $(wc -l < wcp.lst) entries; ok"
          done
          for WCPXZ in *.wcp.xz; do
            echo "== $WCPXZ ($(stat -c %s "$WCPXZ") bytes)"
            echo "   sha256 $(sha256sum "$WCPXZ" | cut -d' ' -f1)  size $(stat -c %s "$WCPXZ")"
            tar -tJf "$WCPXZ" | grep -qx profile.json || { echo "FATAL: profile.json missing from $WCPXZ"; exit 1; }
            echo "   ok"
          done

      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV

      - name: Upload Proton build artifacts for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        uses: actions/upload-artifact@v4
        with:
          name: gdk-proton-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: GDK-Proton-11.0-7-${{ env.ARCH_NAME }}.wcp
          if-no-files-found: error
          retention-days: 30

      # Just the Wayland driver, for replacing it in an installed copy of this same build
      # (arm64ec leg only: the x86_64 box64 leg carries no winewayland).
      - name: Upload Wayland driver for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: gdk-winewayland-${{ env.ARCH_NAME }}
          path: winewayland-files
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wine build artifacts for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        uses: actions/upload-artifact@v4
        with:
          name: gdk-proton-wine-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: GDK-proton-wine-11.0-7-${{ env.ARCH_NAME }}.wcp.xz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Disabled: releases are cut only via the consolidated publish workflow. A push
    # no longer auto-publishes a per-sdk release. Artifacts are still uploaded.
    if: false

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          find artifacts -name "*.wcp.xz" -exec cp {} release/ \;
          ls -lah release/

      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          TAG_NAME="build-p11-${DATE}-gdk11.7"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: GDK-Proton Wine 11.0-7 (${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Caution: This version is provided for testing purposes only. It may lead to game instability or crashes. Use at your own risk.

            ## GE-Proton Wine Build based on Valve [Wine](https://github.com/ValveSoftware/wine/tree/proton_11.0) + GE-Proton11-7 game-fixes

            ### Proton Version: 11.0-7

            Built from commit: ${{ github.sha }}

            ### Architectures
            - arm64ec (ARM64EC)
            - x86_64 (box64)

            ### WCP Files
            **Proton Type:**
            - `GDK-Proton-11.0-7-arm64ec.wcp` - For GameNative
            - `GDK-Proton-11.0-7-x86_64.wcp` - For GameNative

            **Wine Type:**
            - `GDK-proton-wine-11.0-7-arm64ec.wcp.xz` - For Winlator for CMOD & Ludashi
            - `GDK-proton-wine-11.0-7-x86_64.wcp.xz` - For Winlator for CMOD & Ludashi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
